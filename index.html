   LOGIN DO ADMIN
============================================================ */
function AdminLogin({ onAuthed }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [carregando, setCarregando] = useState(false);
  const [erro, setErro] = useState("");

  async function handleLogin() {
    setErro("");
    if (!email.trim() || !senha) { setErro("Preencha e-mail e senha."); return; }
    setCarregando(true);
    const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password: senha });
    if (error) { setErro("E-mail ou senha incorretos."); setCarregando(false); return; }
    const { data: souAdmin } = await sb.from("admins").select("id").eq("id", data.user.id).maybeSingle();
    if (!souAdmin) {
      setErro("Essa conta não tem acesso de administrador.");
      await sb.auth.signOut();
      setCarregando(false);
      return;
    }
    onAuthed();
    setCarregando(false);
  }

  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{ background: `linear-gradient(160deg, ${BRAND.azul}, ${BRAND.azulEscuro})` }}>
      <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl p-8">
        <div className="flex flex-col items-center mb-6">
          <div className="w-16 h-16 rounded-2xl flex items-center justify-center mb-3 text-3xl" style={{ background: `linear-gradient(135deg, ${BRAND.azul}, ${BRAND.roxo})` }}>🛠️</div>
          <h1 className="fredoka text-2xl font-bold text-center" style={{ color: BRAND.azul }}>Painel Admin</h1>
          <p className="text-sm text-slate-400 text-center mt-1">Pegue &amp; Monte · acesso restrito</p>
        </div>
        <label className="block mb-4">
          <span className="block text-sm font-semibold mb-1.5" style={{ color: BRAND.tinta }}>E-mail</span>
          <input className="w-full rounded-xl border-2 border-slate-200 px-4 py-2.5 text-[15px] outline-none focus:border-[#3D5AFE]" value={email} onChange={(e) => setEmail(e.target.value)} type="email" />
        </label>
        <label className="block mb-4">
          <span className="block text-sm font-semibold mb-1.5" style={{ color: BRAND.tinta }}>Senha</span>
          <input className="w-full rounded-xl border-2 border-slate-200 px-4 py-2.5 text-[15px] outline-none focus:border-[#3D5AFE]" value={senha} onChange={(e) => setSenha(e.target.value)} type="password" onKeyDown={(e) => e.key === "Enter" && handleLogin()} />
        </label>
        {erro && <div className="text-sm font-semibold mb-4 px-3 py-2.5 rounded-xl" style={{ background: BRAND.rosa + "15", color: BRAND.rosa }}>⚠️ {erro}</div>}
        <button disabled={carregando} onClick={handleLogin} className="w-full py-3 rounded-xl font-bold text-white cursor-pointer disabled:opacity-60" style={{ background: BRAND.azul }}>
          {carregando ? "Entrando..." : "Entrar"}
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   LISTA DE DECORADORAS + CONTROLE DE ACESSO
============================================================ */
function DecoradorasLista() {
  const [lista, setLista] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [busca, setBusca] = useState("");
  const [salvandoId, setSalvandoId] = useState(null);

  const carregar = useCallback(async () => {
    setCarregando(true);
    const { data, error } = await sb.from("decoradoras").select("*").order("created_at", { ascending: false });
    if (!error) setLista(data || []);
    setCarregando(false);
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  async function mudarStatus(id, novoStatus) {
    setSalvandoId(id);
    const payload = { plano_status: novoStatus };
    if (novoStatus === "trial") payload.trial_fim = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
    const { error } = await sb.from("decoradoras").update(payload).eq("id", id);
    if (!error) setLista((l) => l.map((d) => (d.id === id ? { ...d, ...payload } : d)));
    setSalvandoId(null);
  }

  const filtrada = lista.filter((d) => !busca.trim() || (d.nome_loja || "").toLowerCase().includes(busca.toLowerCase()) || (d.email || "").toLowerCase().includes(busca.toLowerCase()));

  if (carregando) return <div className="text-center py-10 text-slate-400">Carregando decoradoras...</div>;

  return (
    <div>
      <input className="w-full rounded-xl border-2 border-slate-200 px-4 py-2.5 text-sm mb-4" placeholder="🔎 Buscar por nome da loja ou e-mail..." value={busca} onChange={(e) => setBusca(e.target.value)} />
      <div className="space-y-2">
        {filtrada.map((d) => {
          const trialDiasRestantes = d.plano_status === "trial" ? Math.ceil((new Date(d.trial_fim) - new Date(todayISO())) / 86400000) : null;
          return (
            <div key={d.id} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-wrap items-center gap-3">
              <div className="min-w-0 flex-1">
                <p className="font-bold truncate" style={{ color: BRAND.tinta }}>{d.nome_loja}</p>
                <p className="text-xs text-slate-400 truncate">{d.email || "sem e-mail registrado"}</p>
              </div>
              <Pill color={STATUS_CORES[d.plano_status] || BRAND.tinta}>
                {STATUS_LABELS[d.plano_status] || d.plano_status}
                {d.plano_status === "trial" && ` · ${trialDiasRestantes >= 0 ? trialDiasRestantes + "d restantes" : "expirado"}`}
              </Pill>
              <select
                disabled={salvandoId === d.id}
                value={d.plano_status}
                onChange={(e) => mudarStatus(d.id, e.target.value)}
                className="text-xs font-bold rounded-lg border-2 border-slate-200 px-2 py-1.5 cursor-pointer"
              >
                {Object.entries(STATUS_LABELS).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
              </select>
            </div>
          );
        })}
        {filtrada.length === 0 && <p className="text-sm text-slate-400 text-center py-6">Nenhuma decoradora encontrada.</p>}
      </div>
    </div>
  );
}

  if (diffMin < 60) return `há ${diffMin} min`;

function CentralControle() {
  const [status, setStatus] = useState(null);
  const [planos, setPlanos] = useState(null);
  const [logs, setLogs] = useState(null);
  const [decoradoras, setDecoradoras] = useState(null);
  const [falhas, setFalhas] = useState(null);
  const [filtroLog, setFiltroLog] = useState("todos");
  const [statusAberto, setStatusAberto] = useState(null); // 'trial' | 'bloqueada' | null
  const [erro, setErro] = useState("");

  async function carregar() {
    const [rStatus, rPlanos, rLogs, rDecoradoras, rFalhas] = await Promise.all([
      sb.from("status_sistema").select("*"),
      sb.from("resumo_planos").select("*"),
      sb.from("logs_whatsapp").select("*").order("criado_em", { ascending: false }).limit(50),
      sb.from("decoradoras").select("id, nome_loja, email, whatsapp_contato, plano_status, plano_tipo, trial_fim, created_at"),
      sb.from("tentativas_pagamento_falhas").select("*, decoradoras(nome_loja, whatsapp_contato, plano_tipo, email)").order("criado_em", { ascending: false }).limit(50),
    ]);
    const primeiroErro = [rStatus, rPlanos, rLogs, rDecoradoras, rFalhas].map((r) => r.error).find(Boolean);
    if (primeiroErro) setErro(primeiroErro.message);
    setStatus(rStatus.data || []);
    setPlanos(rPlanos.data || []);
    setLogs(rLogs.data || []);
    setDecoradoras(rDecoradoras.data || []);
    setFalhas(rFalhas.data || []);
  }

  useEffect(() => {
    carregar();
    const intervalo = setInterval(carregar, 60000);
    return () => clearInterval(intervalo);
  }, []);

  if (erro) return <div className="text-sm font-semibold px-4 py-3 rounded-xl" style={{ background: BRAND.rosa + "15", color: BRAND.rosa }}>⚠️ {erro}</div>;
  if (!status || !planos || !logs || !decoradoras || !falhas) return <div className="text-center py-10 text-slate-400">Carregando central de controle...</div>;

  const porServico = Object.fromEntries(status.map((s) => [s.servico, s]));
  const mrr = planos.reduce((acc, p) => acc + (Number(p.valor_estimado) || 0), 0);
  const logsFiltrados = logs.filter((l) => filtroLog === "todos" ? true : filtroLog === "sucesso" ? l.sucesso === true : l.sucesso === false);

    .filter((d) => d.plano_status === "trial")

    .sort((a, b) => a.diasRestantes - b.diasRestantes);

    .filter((d) => d.plano_status === "bloqueada")
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  const CARDS_COM_DETALHE = { trial: trialLista, bloqueada: bloqueadaLista };

  return (
    <div className="space-y-6">
      {/* ============ SISTEMA NO AR ============ */}
      <div>
        <p className="text-xs font-bold uppercase tracking-wide mb-3" style={{ color: BRAND.tinta + "80" }}>🟢 Sistema no ar</p>

            <div className="flex gap-2">
              {[["todos", "Todos"], ["sucesso", "Só sucesso"], ["falha", "Só falhas"]].map(([v, label]) => (
                <button key={v} onClick={() => setFiltroLog(v)} className="px-3 py-1 rounded-full text-xs font-bold cursor-pointer" style={filtroLog === v ? { background: BRAND.azul, color: "#fff" } : { background: "#F1F3FA", color: BRAND.tinta }}>{label}</button>

            {logsFiltrados.map((l) => (
              <div key={l.id} className="flex items-center justify-between py-2 border-b border-slate-50 last:border-0 gap-3">
                <div className="min-w-0">
                  <p className="font-semibold text-sm truncate" style={{ color: BRAND.tinta }}>{l.telefone || "—"}</p>
                  <p className="text-xs text-slate-400 truncate">{l.evento} {l.motivo ? `· ${l.motivo}` : ""}</p>
                </div>
                <div className="flex items-center gap-3 shrink-0">
                  {!l.sucesso && l.telefone && (
                    <a href={linkReenviarWhatsApp(l.telefone)} target="_blank" rel="noopener noreferrer" className="px-3 py-1.5 rounded-full text-xs font-bold cursor-pointer text-white" style={{ background: BRAND.turquesa }}>Reenviar</a>

                    <Pill color={l.sucesso ? BRAND.turquesa : BRAND.rosa}>{l.sucesso ? "Enviado" : "Falhou"}</Pill>
                    <p className="text-[11px] text-slate-400 mt-1">{tempoRelativoCC(l.criado_em)}</p>

            ))}
            {logsFiltrados.length === 0 && <p className="text-sm text-slate-400 py-4 text-center">Nenhum envio encontrado.</p>}

  );

   CUSTOS & BALANÇO (custos fixos vs. receita/MRR)
============================================================ */
function isoLocalCB(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function calcularAtalhoCB(chave) {
  const hoje = new Date(); const y = hoje.getFullYear(), m = hoje.getMonth(), d = hoje.getDate();
  if (chave === "hoje") return [isoLocalCB(hoje), isoLocalCB(hoje)];
  if (chave === "ontem") { const on = new Date(y, m, d - 1); return [isoLocalCB(on), isoLocalCB(on)]; }
  if (chave === "7dias") { const ini = new Date(y, m, d - 6); return [isoLocalCB(ini), isoLocalCB(hoje)]; }
  if (chave === "14dias") { const ini = new Date(y, m, d - 13); return [isoLocalCB(ini), isoLocalCB(hoje)]; }
  if (chave === "30dias") { const ini = new Date(y, m, d - 29); return [isoLocalCB(ini), isoLocalCB(hoje)]; }
  if (chave === "semana") { const ini = new Date(y, m, d - hoje.getDay()); return [isoLocalCB(ini), isoLocalCB(hoje)]; }
  if (chave === "mes") { const ini = new Date(y, m, 1); return [isoLocalCB(ini), isoLocalCB(hoje)]; }
  if (chave === "mespassado") { const ini = new Date(y, m - 1, 1); const fim = new Date(y, m, 0); return [isoLocalCB(ini), isoLocalCB(fim)]; }
  if (chave === "ano") { const ini = new Date(y, 0, 1); return [isoLocalCB(ini), isoLocalCB(hoje)]; }
  return [null, null]; // "maximo"
}

function CustosBalancoTab() {
  const [planos, setPlanos] = useState(null);
  const [custos, setCustos] = useState(null);
  const [decoradoras, setDecoradoras] = useState(null);
  const [externo, setExterno] = useState(null); // MRR real + saldo, via Stripe/Cakto (carrega só 1x)
  const [erroExterno, setErroExterno] = useState("");
  const [carregandoExterno, setCarregandoExterno] = useState(true);
  const [carregandoMetaAds, setCarregandoMetaAds] = useState(false);
  const [mostrarCampanhas, setMostrarCampanhas] = useState(false);
  const [salvandoId, setSalvandoId] = useState(null);
  const [erro, setErro] = useState("");
  const [novoNome, setNovoNome] = useState("");
  const [novoValor, setNovoValor] = useState("");

  // Filtro de período — mesmo padrão já usado no Financeiro do painel da decoradora
  const [filtroInicio, setFiltroInicio] = useState(null);
  const [filtroFim, setFiltroFim] = useState(null);
  const [filtroAberto, setFiltroAberto] = useState(false);
  const [rascunhoInicio, setRascunhoInicio] = useState("");
  const [rascunhoFim, setRascunhoFim] = useState("");

  function lerErroFunction(error) {
    let detalhe = error.message || "";
    return error.context?.json().then((corpo) => corpo.motivo || corpo.erro || detalhe).catch(() => detalhe);
  }

  // Carrega Stripe + Cakto + Meta Ads uma única vez (Stripe/Cakto não dependem de período)
  useEffect(() => {
    (async () => {
      setCarregandoExterno(true);
      setErroExterno("");
      const { data, error } = await sb.functions.invoke("financeiro-externo", { body: { desde: filtroInicio, ate: filtroFim } });
      if (!error) setExterno(data);
      else setErroExterno(await lerErroFunction(error));
      setCarregandoExterno(false);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Quando o período muda, busca só o Meta Ads de novo (bem mais rápido)
  const primeiraVezRef = useRef(true);
  useEffect(() => {
    if (primeiraVezRef.current) { primeiraVezRef.current = false; return; }
    (async () => {
      setCarregandoMetaAds(true);
      const { data, error } = await sb.functions.invoke("financeiro-externo", { body: { desde: filtroInicio, ate: filtroFim, soMetaAds: true } });
      if (!error) setExterno((e) => ({ ...e, metaAds: data.metaAds }));
      setCarregandoMetaAds(false);
    })();
  }, [filtroInicio, filtroFim]);

  function aplicarAtalho(chave) {
    const [ini, fim] = calcularAtalhoCB(chave);
    setFiltroInicio(ini); setFiltroFim(fim);
    setFiltroAberto(false);
  }
  function abrirFiltro() {
    setRascunhoInicio(filtroInicio || ""); setRascunhoFim(filtroFim || "");
    setFiltroAberto(true);
  }
  function aplicarPersonalizado() {
    setFiltroInicio(rascunhoInicio || null); setFiltroFim(rascunhoFim || null);
    setFiltroAberto(false);
  }
  const filtroLabel = (!filtroInicio && !filtroFim) ? "Máximo (tudo)" : `${formatDateBR(filtroInicio)} — ${formatDateBR(filtroFim)}`;

  const carregar = useCallback(async () => {
    const [rPlanos, rCustos, rDecoradoras] = await Promise.all([
      sb.from("resumo_planos").select("*"),
      sb.from("custos_fixos").select("*").order("nome"),
      sb.from("decoradoras").select("id, plano_status, created_at"),
    ]);
    const primeiroErro = [rPlanos, rCustos, rDecoradoras].map((r) => r.error).find(Boolean);
    if (primeiroErro) setErro(primeiroErro.message);
    setPlanos(rPlanos.data || []);
    setCustos(rCustos.data || []);
    setDecoradoras(rDecoradoras.data || []);
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  async function salvarValor(id, valor) {
    const numerico = Number(valor) || 0;
    setSalvandoId(id);
    const { error } = await sb.from("custos_fixos").update({ valor: numerico, atualizado_em: new Date().toISOString() }).eq("id", id);
    if (!error) setCustos((c) => c.map((x) => (x.id === id ? { ...x, valor: numerico } : x)));
    setSalvandoId(null);
  }

  async function removerCusto(id) {
    setCustos((c) => c.filter((x) => x.id !== id));
    await sb.from("custos_fixos").delete().eq("id", id);
  }

  async function adicionarCusto() {
    if (!novoNome.trim()) return;
    const { data, error } = await sb.from("custos_fixos").insert({ nome: novoNome.trim(), valor: Number(novoValor) || 0 }).select().maybeSingle();
    if (!error && data) setCustos((c) => [...c, data]);
    setNovoNome(""); setNovoValor("");
  }

  if (erro) return <div className="text-sm font-semibold px-4 py-3 rounded-xl" style={{ background: BRAND.rosa + "15", color: BRAND.rosa }}>⚠️ {erro}</div>;
  if (!planos || !custos || !decoradoras) return <div className="text-center py-10 text-slate-400">Carregando custos e balanço...</div>;

  const mrrEstimado = planos.reduce((acc, p) => acc + (Number(p.valor_estimado) || 0), 0);
  const stripeOk = externo?.stripe && !externo.stripe.erro;
  const caktoOk = externo?.cakto && !externo.cakto.erro;
  const mrrReal = (stripeOk ? externo.stripe.mrr : 0) + (caktoOk ? externo.cakto.mrr : 0);
  // Usa o MRR real (Stripe + Cakto) assim que disponível — a estimativa do banco só serve de placeholder enquanto carrega.
  const mrr = (stripeOk || caktoOk) ? mrrReal : mrrEstimado;
  const totalCustos = custos.reduce((acc, c) => acc + (Number(c.valor) || 0), 0);
  const saldo = mrr - totalCustos;

  const assinaturasAtivasNoPeriodo = decoradoras.filter((d) => {
    if (d.plano_status !== "ativo") return false;
    const dataStr = (d.created_at || "").slice(0, 10);
    if (!dataStr) return false;
    if (filtroInicio && dataStr < filtroInicio) return false;
    if (filtroFim && dataStr > filtroFim) return false;
    return true;
  }).length;

  return (
    <div className="space-y-5">
      <div className="relative">
        <button onClick={() => (filtroAberto ? setFiltroAberto(false) : abrirFiltro())} className="flex items-center gap-2 px-4 py-2.5 rounded-xl border-2 text-sm font-bold cursor-pointer" style={{ borderColor: (filtroInicio || filtroFim) ? BRAND.roxo : "#e2e8f0", color: (filtroInicio || filtroFim) ? BRAND.roxo : BRAND.tinta, background: (filtroInicio || filtroFim) ? BRAND.roxo + "10" : "#fff" }}>
          📅 {filtroLabel}
          <span className="text-xs">{filtroAberto ? "▾" : "▸"}</span>
        </button>

        {filtroAberto && (
          <>
            <div className="fixed inset-0 z-30" onClick={() => setFiltroAberto(false)} />
            <div className="absolute left-0 top-full mt-2 z-40 bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden" style={{ width: 320, maxWidth: "90vw" }}>
              <div className="flex flex-col sm:flex-row">
                <div className="flex sm:flex-col overflow-x-auto sm:overflow-visible border-b sm:border-b-0 sm:border-r border-slate-100" style={{ background: "#FAFAFC" }}>
                  {[
                    ["hoje", "Hoje"], ["ontem", "Ontem"], ["7dias", "Últimos 7 dias"], ["14dias", "Últimos 14 dias"],
                    ["30dias", "Últimos 30 dias"], ["semana", "Esta semana"], ["mes", "Este mês"], ["mespassado", "Mês passado"],
                    ["ano", "Este ano"], ["maximo", "Máximo"],
                  ].map(([chave, label]) => (
                    <button key={chave} type="button" onClick={() => aplicarAtalho(chave)} className="text-left text-xs font-semibold px-3.5 py-2.5 whitespace-nowrap sm:whitespace-normal hover:bg-white cursor-pointer" style={{ color: BRAND.tinta }}>
                      {label}
                    </button>
                  ))}
                </div>
                <div className="p-3.5 flex-1">
                  <p className="text-xs font-bold mb-2" style={{ color: BRAND.tinta }}>Período personalizado</p>
                  <label className="block mb-2">
                    <span className="block text-[11px] text-slate-400 mb-1">De</span>
                    <input type="date" className="w-full rounded-lg border-2 border-slate-200 px-2 py-1.5 text-sm" value={rascunhoInicio} onChange={(e) => setRascunhoInicio(e.target.value)} />
                  </label>
                  <label className="block mb-3">
                    <span className="block text-[11px] text-slate-400 mb-1">Até</span>
                    <input type="date" className="w-full rounded-lg border-2 border-slate-200 px-2 py-1.5 text-sm" value={rascunhoFim} onChange={(e) => setRascunhoFim(e.target.value)} />
                  </label>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setFiltroAberto(false)} className="flex-1 py-2 rounded-lg text-xs font-bold cursor-pointer" style={{ background: "#f1f5f9", color: "#64748b" }}>Cancelar</button>
                    <button type="button" onClick={aplicarPersonalizado} className="flex-1 py-2 rounded-lg text-xs font-bold text-white cursor-pointer" style={{ background: BRAND.roxo }}>Atualizar</button>
                  </div>
                </div>
              </div>
            </div>
          </>
        )}
      </div>

      <div>
        <p className="text-xs font-bold uppercase tracking-wide mb-2" style={{ color: BRAND.tinta + "80" }}>📊 Resumo</p>
        <div className="grid sm:grid-cols-2 lg:grid-cols-5 gap-3">
          <div className="rounded-2xl p-4 shadow-sm text-white" style={{ background: `linear-gradient(120deg, ${BRAND.turquesa}, ${BRAND.azul})` }}>
            <p className="text-xs font-bold uppercase opacity-80">Receita (MRR)</p>
            <p className="text-2xl font-extrabold mt-1">{formatBRL(mrr)}</p>
          </div>
          <div className="rounded-2xl p-4 shadow-sm text-white" style={{ background: `linear-gradient(120deg, ${BRAND.rosa}, #F97316)` }}>
            <p className="text-xs font-bold uppercase opacity-80">Custos fixos</p>
            <p className="text-2xl font-extrabold mt-1">{formatBRL(totalCustos)}</p>
          </div>
          <div className="rounded-2xl p-4 shadow-sm text-white" style={{ background: `linear-gradient(120deg, ${BRAND.roxo}, ${BRAND.azul})` }}>
            <p className="text-xs font-bold uppercase opacity-80">Assinaturas ativas</p>
            <p className="text-2xl font-extrabold mt-1">{assinaturasAtivasNoPeriodo}</p>
          </div>
          <div className="rounded-2xl p-4 shadow-sm text-white" style={{ background: `linear-gradient(120deg, ${BRAND.azulEscuro}, ${BRAND.rosa})` }}>
            <p className="text-xs font-bold uppercase opacity-80">Gasto c/ anúncio</p>
            {carregandoExterno || carregandoMetaAds ? (
              <p className="text-sm mt-1 opacity-80">...</p>
            ) : externo?.metaAds?.erro ? (
              <p className="text-xs font-semibold mt-1 opacity-90">⚠️ indisponível</p>
            ) : (
              <p className="text-2xl font-extrabold mt-1">{formatBRL(externo?.metaAds?.spend)}</p>
            )}
          </div>
          <div className="rounded-2xl p-4 shadow-sm text-white" style={{ background: `linear-gradient(120deg, ${BRAND.turquesa}, #16A34A)` }}>
            <p className="text-xs font-bold uppercase opacity-80">Saldo</p>
            <p className="text-2xl font-extrabold mt-1">{formatBRL(saldo)}</p>
          </div>
        </div>
        <p className="text-[11px] text-slate-400 mt-2">
          Receita {(stripeOk || caktoOk) ? "é o MRR real (Stripe + Cakto)" : "é uma estimativa do banco (carregando o real...)"}. Custos fixos e saldo são a foto de agora. Assinaturas ativas e gasto com anúncio respeitam o período selecionado acima.
        </p>
      </div>

      <div>
        <p className="text-xs font-bold uppercase tracking-wide mb-2" style={{ color: BRAND.tinta + "80" }}>🔗 MRR real (direto da Stripe e da Cakto)</p>
        {carregandoExterno ? (
          <p className="text-sm text-slate-400">Consultando Stripe e Cakto...</p>
        ) : !externo ? (
          <p className="text-sm text-rose-500">⚠️ {erroExterno || "Não consegui consultar a Stripe/Cakto agora."}</p>
        ) : (
          <div className="grid sm:grid-cols-2 gap-3">
            <div className="bg-white rounded-2xl p-4 shadow-sm border-2" style={{ borderColor: "#F1F3FA" }}>
              <p className="text-xs font-bold uppercase" style={{ color: BRAND.roxo }}>Stripe</p>
              {externo.stripe?.erro ? (
                <p className="text-sm font-semibold mt-1 text-rose-500">⚠️ {externo.stripe.erro}</p>
              ) : (
                <>
                  <p className="text-xl font-extrabold mt-1" style={{ color: BRAND.tinta }}>{formatBRL(externo.stripe.mrr)} <span className="text-xs font-semibold text-slate-400">MRR real</span></p>
                  <p className="text-xs text-slate-400 mt-1">Saldo disponível pra saque: <b>{formatBRL(externo.stripe.saldoDisponivel)}</b></p>
                  <p className="text-xs text-slate-400">Saldo pendente: {formatBRL(externo.stripe.saldoPendente)}</p>
                </>
              )}
            </div>
            <div className="bg-white rounded-2xl p-4 shadow-sm border-2" style={{ borderColor: "#F1F3FA" }}>
              <p className="text-xs font-bold uppercase" style={{ color: BRAND.turquesa }}>Cakto</p>
              {externo.cakto?.erro ? (
                <p className="text-sm font-semibold mt-1 text-rose-500">⚠️ {externo.cakto.erro}</p>
              ) : (
                <>
                  <p className="text-xl font-extrabold mt-1" style={{ color: BRAND.tinta }}>{formatBRL(externo.cakto.mrr)} <span className="text-xs font-semibold text-slate-400">MRR real</span></p>
                  <p className="text-xs text-slate-400 mt-1">A Cakto não tem endpoint de saldo/saque na API pública ainda.</p>
                </>
              )}
            </div>
          </div>
        )}
      </div>

      {externo?.diagnostico && !externo.diagnostico.erro && (
        <div className="bg-white rounded-2xl p-5 shadow-sm border-2 border-amber-300">
          <p className="font-bold text-sm mb-3" style={{ color: BRAND.tinta }}>🔍 Diagnóstico temporário — status banco vs. Stripe/Cakto real</p>
          {[
            ["Tem assinatura Stripe ATIVA mas status no banco não é 'ativo'", externo.diagnostico.stripeDeveriaEstarAtivo],
            ["Status 'ativo' no banco mas Stripe NÃO mostra essa assinatura como ativa", externo.diagnostico.stripeNaoDeveriaEstarAtivo],
            ["Tem assinatura Cakto ATIVA mas status no banco não é 'ativo'", externo.diagnostico.caktoDeveriaEstarAtivo],
            ["Status 'ativo' no banco mas Cakto NÃO mostra essa assinatura como ativa", externo.diagnostico.caktoNaoDeveriaEstarAtivo],
          ].map(([titulo, lista]) => (
            <div key={titulo} className="mb-3">
              <p className="text-xs font-bold" style={{ color: (lista || []).length > 0 ? BRAND.rosa : BRAND.turquesa }}>{titulo}: {(lista || []).length}</p>
              {(lista || []).map((d, i) => (
                <p key={i} className="text-xs text-slate-500 ml-2">• {d.nome_loja || "sem nome"} ({d.email || "sem email"}){d.status_no_banco ? ` — banco diz: ${d.status_no_banco}` : ""}</p>
              ))}
            </div>

      {externo?.metaAds && !externo.metaAds.erro && (
        <div className="text-xs text-slate-400 -mt-3">

          </button>
          {mostrarCampanhas && externo.metaAds.campanhas?.length > 0 && (
            <p className="mt-1">{externo.metaAds.campanhas.join(", ")}</p>
          )}
        </div>
      )}
      {externo?.metaAds?.erro && (
        <p className="text-xs text-rose-500 -mt-3">⚠️ Meta Ads: {externo.metaAds.erro}</p>
      )}

      <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <p className="font-bold text-sm mb-3" style={{ color: BRAND.tinta }}>💸 Custos fixos mensais</p>
        <div className="space-y-2 mb-4">
          {custos.map((c) => (
            <div key={c.id} className="flex items-center gap-3 py-2 border-b border-slate-50 last:border-0">
              <p className="flex-1 text-sm font-semibold truncate" style={{ color: BRAND.tinta }}>{c.nome}</p>
              <div className="flex items-center gap-1 shrink-0">
                <span className="text-xs text-slate-400">R$</span>
                <input
                  type="number" step="0.01" defaultValue={c.valor}
                  onBlur={(e) => salvarValor(c.id, e.target.value)}
                  disabled={salvandoId === c.id}
                  className="w-24 rounded-lg border-2 border-slate-200 px-2 py-1 text-sm text-right"
                />
              </div>
              <button onClick={() => removerCusto(c.id)} className="text-rose-400 cursor-pointer shrink-0">🗑</button>
            </div>
          ))}
          {custos.length === 0 && <p className="text-sm text-slate-400">Nenhum custo cadastrado.</p>}
        </div>
        <div className="grid sm:grid-cols-3 gap-2">
          <input className="sm:col-span-2 rounded-xl border-2 border-slate-200 px-3 py-2 text-sm" placeholder="Nome do custo" value={novoNome} onChange={(e) => setNovoNome(e.target.value)} />
          <div className="flex gap-2">
            <input type="number" step="0.01" className="flex-1 rounded-xl border-2 border-slate-200 px-3 py-2 text-sm" placeholder="Valor" value={novoValor} onChange={(e) => setNovoValor(e.target.value)} />
            <button onClick={adicionarCusto} className="px-3 py-2 rounded-xl font-bold text-white text-sm cursor-pointer shrink-0" style={{ background: BRAND.azul }}>+ Adicionar</button>
          </div>
        </div>
      </div>
      <p className="text-xs text-slate-400">💡 O card "MRR real" abaixo busca direto na Stripe/Cakto (mais preciso); o card "Receita" do resumo é uma estimativa a partir do banco.</p>
    </div>
  );
}

/* ============================================================
   TROCAR SENHA (emergência — quando o e-mail de recuperação falha)
============================================================ */
// Precisa bater com o segredo ADMIN_RESET_SECRET configurado nas
// variáveis da function "admin-reset-senha" lá no Supabase.
const ADMIN_RESET_SECRET = "appdecore-adm-9f2k7x";

function TrocarSenhaTab() {
  const [busca, setBusca] = useState("");
  const [resultados, setResultados] = useState([]);
  const [buscando, setBuscando] = useState(false);
  const [jaBuscou, setJaBuscou] = useState(false);
  const [selecionada, setSelecionada] = useState(null);
  const [trocando, setTrocando] = useState(false);
  const [senhaGerada, setSenhaGerada] = useState("");
  const [erro, setErro] = useState("");

  async function buscar() {
    if (!busca.trim()) { setResultados([]); return; }
    setBuscando(true);
    setErro(""); setSenhaGerada(""); setSelecionada(null);
    const termo = busca.trim();
    const { data, error } = await sb.from("decoradoras")
      .select("id, nome_loja, email, plano_tipo, plano_status")
      .or(`nome_loja.ilike.%${termo}%,email.ilike.%${termo}%`)
      .limit(15);
    if (!error) setResultados(data || []);
    setBuscando(false);
    setJaBuscou(true);
  }

  async function trocarSenha() {
    if (!selecionada || !selecionada.email) return;
    setTrocando(true); setErro(""); setSenhaGerada("");
    try {
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/admin-reset-senha`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: selecionada.email, secret: ADMIN_RESET_SECRET }),
      });
      const data = await resp.json();
      if (!data.ok) setErro(data.erro || "Erro ao trocar a senha.");
      else setSenhaGerada(data.senha);
    } catch (e) {
      setErro("Erro de conexão: " + e.message);
    }
    setTrocando(false);
  }

  return (
    <div>
      <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 mb-4">
        <p className="font-bold mb-1" style={{ color: BRAND.tinta }}>🔑 Trocar senha de uma cliente</p>
        <p className="text-xs text-slate-400 mb-4">Pra quando o link de recuperação por e-mail não funciona (provedor de e-mail bloqueando, etc). Gera uma senha nova na hora, sem depender de e-mail nenhum.</p>
        <div className="flex gap-2">
          <input
            className="flex-1 rounded-xl border-2 border-slate-200 px-4 py-2.5 text-sm"
            placeholder="🔎 Buscar por nome da loja ou e-mail..."
            value={busca}
            onChange={(e) => setBusca(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && buscar()}
          />
          <button onClick={buscar} disabled={buscando} className="px-5 py-2.5 rounded-xl font-bold text-white text-sm cursor-pointer disabled:opacity-60 shrink-0" style={{ background: BRAND.azul }}>
            {buscando ? "..." : "🔎 Buscar"}
          </button>
        </div>
      </div>

      {resultados.length > 0 && !selecionada && (
        <div className="space-y-2 mb-4">
          {resultados.map((d) => (
            <button key={d.id} onClick={() => setSelecionada(d)} className="w-full text-left bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center gap-3 cursor-pointer hover:border-slate-300 transition">
              <div className="min-w-0 flex-1">
                <p className="font-bold truncate" style={{ color: BRAND.tinta }}>{d.nome_loja}</p>
                <p className="text-xs text-slate-400 truncate">{d.email || "sem e-mail registrado"}</p>
              </div>
              <Pill color={STATUS_CORES[d.plano_status] || BRAND.tinta}>{STATUS_LABELS[d.plano_status] || d.plano_status}</Pill>
            </button>
          ))}
        </div>
      )}
      {jaBuscou && resultados.length === 0 && !buscando && (
        <p className="text-sm text-slate-400 text-center py-4">Nenhuma decoradora encontrada com esse nome/e-mail.</p>
      )}

      {selecionada && (
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
          <div className="flex items-center justify-between mb-4 gap-3">
            <div className="min-w-0">
              <p className="font-bold truncate" style={{ color: BRAND.tinta }}>{selecionada.nome_loja}</p>
              <p className="text-xs text-slate-400 truncate">{selecionada.email}</p>
            </div>
            <button onClick={() => { setSelecionada(null); setSenhaGerada(""); setErro(""); }} className="text-xs text-slate-400 underline cursor-pointer shrink-0">Trocar de cliente</button>
          </div>

          {!selecionada.email ? (
            <p className="text-xs text-red-500">Essa decoradora não tem e-mail cadastrado — não dá pra trocar a senha.</p>
          ) : !senhaGerada ? (
            <button onClick={trocarSenha} disabled={trocando} className="w-full py-3 rounded-xl font-bold text-white cursor-pointer disabled:opacity-60" style={{ background: BRAND.rosa }}>
              {trocando ? "Gerando senha nova..." : "Gerar senha nova"}
            </button>
          ) : (
            <div className="rounded-xl p-4" style={{ background: BRAND.bg }}>
              <p className="text-xs text-slate-500 mb-1">Senha nova — copia e manda pra ela por WhatsApp:</p>
              <p className="fredoka text-2xl font-bold tracking-wide" style={{ color: BRAND.azul }}>{senhaGerada}</p>
              <button onClick={() => navigator.clipboard.writeText(senhaGerada)} className="mt-2 text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer" style={{ background: BRAND.turquesa + "22", color: BRAND.turquesa }}>📋 Copiar senha</button>
            </div>
          )}
          {erro && <p className="text-xs text-red-500 mt-3">{erro}</p>}
        </div>
      )}
    </div>
  );
}

/* ============================================================

/* ============================================================
   CONFIGURAÇÕES (suporte, vídeos, FAQ, comunidade)
============================================================ */
function ConfiguracoesTab() {
  const [config, setConfig] = useState(null);
  const [salvando, setSalvando] = useState(false);
  const [salvo, setSalvo] = useState(false);
  const [novoVideoTitulo, setNovoVideoTitulo] = useState("");
  const [novoVideoUrl, setNovoVideoUrl] = useState("");
  const [novaPergunta, setNovaPergunta] = useState("");
  const [novaResposta, setNovaResposta] = useState("");

  useEffect(() => {
    sb.from("app_config").select("*").eq("id", 1).maybeSingle().then(({ data }) => setConfig(data || { suporte_whatsapp: "", suporte_mensagem: "", comunidade_link: "", videos: [], faq: [] }));
  }, []);

  function set(campo, valor) { setConfig((c) => ({ ...c, [campo]: valor })); setSalvo(false); }

  async function salvar() {
    setSalvando(true);
    const { error } = await sb.from("app_config").update({
      suporte_whatsapp: config.suporte_whatsapp, suporte_mensagem: config.suporte_mensagem,
      comunidade_link: config.comunidade_link, videos: config.videos, faq: config.faq,
    }).eq("id", 1);
    setSalvando(false);
    if (!error) setSalvo(true);
  }

  function adicionarVideo() {
    if (!novoVideoTitulo.trim() || !novoVideoUrl.trim()) return;
    set("videos", [...(config.videos || []), { titulo: novoVideoTitulo.trim(), url: novoVideoUrl.trim() }]);
    setNovoVideoTitulo(""); setNovoVideoUrl("");
  }
  function removerVideo(i) { set("videos", config.videos.filter((_, idx) => idx !== i)); }

  function adicionarFaq() {
    if (!novaPergunta.trim() || !novaResposta.trim()) return;
    set("faq", [...(config.faq || []), { pergunta: novaPergunta.trim(), resposta: novaResposta.trim() }]);
    setNovaPergunta(""); setNovaResposta("");
  }
  function removerFaq(i) { set("faq", config.faq.filter((_, idx) => idx !== i)); }

  if (!config) return <div className="text-center py-10 text-slate-400">Carregando...</div>;

  return (
    <div className="space-y-5">
      <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <p className="font-bold text-sm mb-3" style={{ color: BRAND.tinta }}>💬 Suporte</p>
        <label className="block mb-3">
          <span className="block text-xs font-semibold mb-1" style={{ color: BRAND.tinta }}>WhatsApp de suporte (com DDD)</span>
          <input className="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm" value={config.suporte_whatsapp || ""} onChange={(e) => set("suporte_whatsapp", e.target.value)} placeholder="(61) 99999-8888" />
        </label>
        <label className="block">
          <span className="block text-xs font-semibold mb-1" style={{ color: BRAND.tinta }}>Mensagem inicial</span>
          <input className="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm" value={config.suporte_mensagem || ""} onChange={(e) => set("suporte_mensagem", e.target.value)} placeholder="Olá! Preciso de ajuda com o app." />
        </label>
      </div>

      <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <p className="font-bold text-sm mb-3" style={{ color: BRAND.tinta }}>🗺️ Comunidade</p>
        <label className="block">
          <span className="block text-xs font-semibold mb-1" style={{ color: BRAND.tinta }}>Link do grupo (WhatsApp, Telegram, etc.)</span>
          <input className="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm" value={config.comunidade_link || ""} onChange={(e) => set("comunidade_link", e.target.value)} placeholder="https://chat.whatsapp.com/..." />
        </label>
      </div>

      <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <p className="font-bold text-sm mb-3" style={{ color: BRAND.tinta }}>🎬 Vídeos ("Aprenda mais")</p>
        <div className="space-y-2 mb-3">
          {(config.videos || []).map((v, i) => (
            <div key={i} className="flex items-start justify-between gap-2 text-sm bg-slate-50 rounded-lg px-3 py-2">
              <span className="min-w-0 flex-1 break-words">{v.titulo} — <span className="text-slate-400 break-all">{v.url}</span></span>
              <button onClick={() => removerVideo(i)} className="text-rose-400 cursor-pointer shrink-0">🗑</button>
            </div>
          ))}
          {(!config.videos || config.videos.length === 0) && <p className="text-xs text-slate-400">Nenhum vídeo cadastrado.</p>}
        </div>
        <div className="grid sm:grid-cols-3 gap-2">
          <input className="sm:col-span-1 rounded-xl border-2 border-slate-200 px-3 py-2 text-sm" placeholder="Título" value={novoVideoTitulo} onChange={(e) => setNovoVideoTitulo(e.target.value)} />
          <input className="sm:col-span-1 rounded-xl border-2 border-slate-200 px-3 py-2 text-sm" placeholder="Link do vídeo (YouTube, Drive...)" value={novoVideoUrl} onChange={(e) => setNovoVideoUrl(e.target.value)} />
          <button onClick={adicionarVideo} className="px-3 py-2 rounded-xl font-bold text-white text-sm cursor-pointer" style={{ background: BRAND.azul }}>+ Adicionar</button>
        </div>
      </div>

      <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <p className="font-bold text-sm mb-3" style={{ color: BRAND.tinta }}>🧩 Problemas e Soluções (FAQ)</p>
        <div className="space-y-2 mb-3">
          {(config.faq || []).map((f, i) => (
            <div key={i} className="flex items-start justify-between gap-2 text-sm bg-slate-50 rounded-lg px-3 py-2">
              <div className="min-w-0 flex-1">
                <p className="font-semibold break-words">{f.pergunta}</p>
                <p className="text-slate-400 text-xs mt-0.5 break-words">{f.resposta}</p>
              </div>
              <button onClick={() => removerFaq(i)} className="text-rose-400 cursor-pointer shrink-0">🗑</button>
            </div>
          ))}
          {(!config.faq || config.faq.length === 0) && <p className="text-xs text-slate-400">Nenhuma pergunta cadastrada.</p>}
        </div>
        <input className="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm mb-2" placeholder="Pergunta" value={novaPergunta} onChange={(e) => setNovaPergunta(e.target.value)} />
        <textarea className="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm mb-2" rows={2} placeholder="Resposta" value={novaResposta} onChange={(e) => setNovaResposta(e.target.value)} />
        <button onClick={adicionarFaq} className="px-3 py-2 rounded-xl font-bold text-white text-sm cursor-pointer" style={{ background: BRAND.azul }}>+ Adicionar pergunta</button>
      </div>

      <button disabled={salvando} onClick={salvar} className="w-full py-3 rounded-xl font-bold text-white cursor-pointer disabled:opacity-60" style={{ background: BRAND.rosa }}>
        {salvando ? "Salvando..." : salvo ? "✅ Salvo!" : "Salvar configurações"}
      </button>
    </div>
  );
}

function AdminApp() {
  const [session, setSession] = useState(undefined);
  const [autorizado, setAutorizado] = useState(false);
  const [aba, setAba] = useState("decoradoras");

  useEffect(() => {
    sb.auth.getSession().then(async ({ data }) => {
      setSession(data.session);
      if (data.session) {
        const { data: souAdmin } = await sb.from("admins").select("id").eq("id", data.session.user.id).maybeSingle();
        setAutorizado(!!souAdmin);
      }
    });
    const { data: listener } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  async function handleLogout() { await sb.auth.signOut(); setAutorizado(false); }

  if (session === undefined) return <div className="min-h-screen flex items-center justify-center" style={{ background: BRAND.azul }}><span className="text-white">Carregando...</span></div>;
  if (!session || !autorizado) return <AdminLogin onAuthed={() => setAutorizado(true)} />;

  return (
    <div className="min-h-screen" style={{ background: BRAND.bg }}>
      <div className="sticky top-0 z-20 text-white" style={{ background: `linear-gradient(120deg, ${BRAND.azul}, ${BRAND.azulEscuro})` }}>
        <div className="max-w-5xl mx-auto px-5 py-4 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <span className="text-xl">🛠️</span>
            <p className="fredoka font-bold">Painel Admin</p>
          </div>
          <button onClick={handleLogout} className="p-2 rounded-full hover:bg-white/10 cursor-pointer">🚪</button>
        </div>
      </div>
      <div className="max-w-5xl mx-auto px-4 sm:px-5 py-6 sm:py-7">
        <div className="flex flex-wrap gap-2 mb-6">
          <button onClick={() => setAba("decoradoras")} className="px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold cursor-pointer" style={aba === "decoradoras" ? { background: BRAND.azul, color: "#fff" } : { background: "#fff", color: BRAND.tinta }}>Decoradoras</button>
          <button onClick={() => setAba("relatorios")} className="px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold cursor-pointer" style={aba === "relatorios" ? { background: BRAND.azul, color: "#fff" } : { background: "#fff", color: BRAND.tinta }}>Relatórios</button>
          <button onClick={() => setAba("configuracoes")} className="px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold cursor-pointer" style={aba === "configuracoes" ? { background: BRAND.azul, color: "#fff" } : { background: "#fff", color: BRAND.tinta }}>Configurações</button>
          <button onClick={() => setAba("central")} className="px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold cursor-pointer" style={aba === "central" ? { background: BRAND.azul, color: "#fff" } : { background: "#fff", color: BRAND.tinta }}>Central de Controle</button>
          <button onClick={() => setAba("custos")} className="px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold cursor-pointer" style={aba === "custos" ? { background: BRAND.azul, color: "#fff" } : { background: "#fff", color: BRAND.tinta }}>💰 Custos &amp; Balanço</button>
          <button onClick={() => setAba("senha")} className="px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold cursor-pointer" style={aba === "senha" ? { background: BRAND.azul, color: "#fff" } : { background: "#fff", color: BRAND.tinta }}>🔑 Trocar Senha</button>
        </div>
        {aba === "decoradoras" ? <DecoradorasLista /> : aba === "relatorios" ? <Relatorios /> : aba === "central" ? <CentralControle /> : aba === "custos" ? <CustosBalancoTab /> : aba === "senha" ? <TrocarSenhaTab /> : <ConfiguracoesTab />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AdminApp />);
</script>
